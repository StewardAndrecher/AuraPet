name: Build, Test & Release (macOS + Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install cmake ninja qt@6 libavif libarchive

      - name: Configure & Build (Release Assets)
        run: |
          QT_PREFIX="$(brew --prefix qt@6)"
          AVIF_PREFIX="$(brew --prefix libavif)"
          ARCHIVE_PREFIX="$(brew --prefix libarchive)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX};${AVIF_PREFIX};${ARCHIVE_PREFIX}" \
            -DAURAPET_RELEASE_ASSETS=ON \
            -DBUILD_TESTING=ON
          cmake --build build --parallel

      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS One-Click Installer
        run: |
          QT_PREFIX="$(brew --prefix qt@6)"
          chmod +x distribution/package-macos.sh
          ./distribution/package-macos.sh --ci build/AuraPet.app "$QT_PREFIX" dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurapet-macos-arm64
          path: |
            dist/*.zip
            dist/*SHA256SUMS.txt

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          install-deps: 'false'

      - name: Install native libraries via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libavif:x64-windows libarchive:x64-windows

      - name: Configure & Build (Release Assets)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DAURAPET_RELEASE_ASSETS=ON `
            -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel

      - name: Run regression tests
        shell: pwsh
        run: |
          $env:PATH = "$env:Qt6_DIR\bin;$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows One-Click Installer
        shell: pwsh
        run: |
          .\distribution\package-windows.ps1 `
            -BuiltExe "build\Release\AuraPet.exe" `
            -QtBinDir "$env:Qt6_DIR\bin" `
            -VcpkgBinDir "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" `
            -OutputDir "dist"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurapet-windows-x64
          path: |
            dist/*.zip
            dist/*SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    needs: [ build-macos, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Merge SHA256SUMS
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION.txt)"
          cat release-assets/*SHA256SUMS.txt > "release-assets/AuraPet-${VERSION}-SHA256SUMS.txt"
          rm -f release-assets/*-macOS-SHA256SUMS.txt release-assets/*-Windows-SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/AuraPet-*-SHA256SUMS.txt
