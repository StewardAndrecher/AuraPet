<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" width="1080" height="450" role="img" aria-label="AuraPet 跨虚拟桌面方向感知随行与活跃窗口下第二浮现层">
  <defs>
    <linearGradient id="bgSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#1D2232"/>
    </linearGradient>
    <linearGradient id="hopArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0B85B" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#F6CA75" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF3D1" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="layer2Glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B05C" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#E8B05C" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06080E" flood-opacity="0.42"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes dashMove {
        to { stroke-dashoffset: -28; }
      }
      @keyframes hopLanding {
        0%, 100% { transform: translateY(0px); }
        45% { transform: translateY(-8px); }
      }
      @keyframes pulseZone {
        0%, 100% { fill-opacity: 0.12; stroke-opacity: 0.45; }
        50% { fill-opacity: 0.24; stroke-opacity: 0.85; }
      }
      .arc-anim { stroke-dasharray: 7 7; animation: dashMove 1.1s linear infinite; }
      .hop-pet { animation: hopLanding 2.4s ease-in-out infinite; }
      .zone-pulse { animation: pulseZone 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="450" rx="18" fill="url(#bgSpace)"/>
  <rect x="0.75" y="0.75" width="1078.5" height="448.5" rx="17.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Divider -->
  <line x1="540" y1="32" x2="540" y2="418" stroke="#FFFFFF" stroke-opacity="0.09" stroke-dasharray="4 5"/>

  <!-- ========================================================= -->
  <!-- LEFT PANEL: Cross-Space Direction-Aware Transit           -->
  <!-- ========================================================= -->
  <text x="36" y="38" class="ui" font-size="14.5" font-weight="700" fill="#F4F6FA">跨虚拟桌面随行：按真实左右方位跃入近端 + 气泡无缝续写</text>
  <text x="36" y="58" class="ui" font-size="11.5" fill="#9BA4B5">拒绝切屏瞬间悬停闪烁：随原桌面自然滑出，再从相邻边界灵动跑/跳进入新桌面</text>

  <!-- Desktop 1 (Left / Outgoing Space) -->
  <g filter="url(#boxShadow)">
    <rect x="36" y="80" width="206" height="224" rx="12" fill="#1B202E" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="36" y="80" width="206" height="26" rx="12" fill="#23293A"/>
    <rect x="36" y="94" width="206" height="12" fill="#23293A"/>
    <text x="50" y="97" class="ui" font-size="11" font-weight="600" fill="#B6C0D4">桌面 1（原桌面）</text>
    <text x="166" y="97" class="ui" font-size="10" fill="#7F8A9F">Managed 锁定</text>

    <!-- Mock window in Space 1 -->
    <rect x="50" y="118" width="132" height="96" rx="7" fill="#242B3D" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <rect x="60" y="132" width="84" height="7" rx="3.5" fill="#343E56"/>
    <rect x="60" y="146" width="108" height="6" rx="3" fill="#2D364B"/>
    <rect x="60" y="158" width="96" height="6" rx="3" fill="#2D364B"/>

    <!-- Ghosted Outgoing Pet locked to Space 1 -->
    <g opacity="0.46">
      <ellipse cx="192" cy="272" rx="18" ry="5" fill="#090C12"/>
      <circle cx="192" cy="238" r="16" fill="#DCE3EE"/>
      <path d="M 179 228 L 175 214 L 187 223 Z" fill="#8C99AE"/>
      <path d="M 205 228 L 209 214 L 197 223 Z" fill="#8C99AE"/>
      <rect x="178" y="252" width="28" height="20" rx="9" fill="#3A4759"/>
    </g>
    <text x="139" y="293" text-anchor="middle" class="ui" font-size="10.5" fill="#94A0B8">随原桌面平滑退场（不闪现）</text>
  </g>

  <!-- Transition Arrow Between Spaces -->
  <rect x="247" y="168" width="44" height="36" rx="8" fill="#E8B05C" fill-opacity="0.14" stroke="#E8B05C" stroke-opacity="0.45"/>
  <text x="269" y="183" text-anchor="middle" class="ui" font-size="9.5" font-weight="700" fill="#FCE3B4">切往右屏</text>
  <text x="269" y="197" text-anchor="middle" class="ui" font-size="12" font-weight="700" fill="#FCE3B4">──▶</text>

  <!-- Desktop 2 (Right / Active Target Space) -->
  <g filter="url(#boxShadow)">
    <rect x="296" y="80" width="218" height="224" rx="12" fill="#1F2637" stroke="#E8B05C" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect x="296" y="80" width="218" height="26" rx="12" fill="#283146"/>
    <rect x="296" y="94" width="218" height="12" fill="#283146"/>
    <circle cx="310" cy="93" r="4" fill="#6EE7B7"/>
    <text x="320" y="97" class="ui" font-size="11" font-weight="700" fill="#F4F6FA">桌面 2（当前活跃桌面）</text>

    <!-- Near-Edge Landing Zone Highlight -->
    <rect class="zone-pulse" x="304" y="116" width="82" height="176" rx="9" fill="#E8B05C" stroke="#F0BA63" stroke-dasharray="4 4"/>
    <text x="345" y="133" text-anchor="middle" class="ui" font-size="10" font-weight="700" fill="#FCE3B4">左侧近端落点区</text>

    <!-- Mock Window on Right Side of Space 2 -->
    <rect x="396" y="122" width="106" height="134" rx="7" fill="#262F45" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="406" y="136" width="70" height="7" rx="3.5" fill="#394663"/>
    <rect x="406" y="150" width="84" height="6" rx="3" fill="#303B54"/>
    <rect x="406" y="162" width="76" height="6" rx="3" fill="#303B54"/>

    <!-- Parabolic Entry Trajectory from Left Shared Border -->
    <path class="arc-anim" d="M 294 252 Q 320 198 348 248" fill="none" stroke="url(#hopArcGrad)" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Arriving Pet + Following Speech Bubble -->
    <g class="hop-pet">
      <!-- Speech Bubble Continuing Seamlessly -->
      <rect x="310" y="150" width="158" height="44" rx="10" fill="#FFFCF6" stroke="#E6D7C3"/>
      <path d="M 350 194 L 344 203 L 360 194 Z" fill="#FFFCF6"/>
      <text x="320" y="168" class="ui" font-size="10" font-weight="700" fill="#8B5E2B">气泡随行续写 · 不断句</text>
      <text x="320" y="184" class="ui" font-size="10.5" fill="#2B303C">“…跟过来啦，继续刚才的话题”</text>

      <!-- Pet Character -->
      <ellipse cx="348" cy="272" rx="20" ry="5.5" fill="#090C12" fill-opacity="0.55"/>
      <circle cx="348" cy="236" r="17" fill="#F2F5FA"/>
      <path d="M 334 225 L 329 210 L 343 220 Z" fill="#6FC39F"/>
      <path d="M 362 225 L 367 210 L 353 220 Z" fill="#6FC39F"/>
      <circle cx="342" cy="237" r="2.1" fill="#2A3441"/>
      <circle cx="354" cy="237" r="2.1" fill="#2A3441"/>
      <rect x="333" y="251" width="30" height="21" rx="9.5" fill="#354356"/>
    </g>
    <text x="405" y="293" text-anchor="middle" class="ui" font-size="10.5" fill="#FCE3B4">自左邻桌面 → 从左边缘跃入</text>
  </g>

  <!-- Left Panel Bottom Feature Pills -->
  <rect x="36" y="322" width="478" height="96" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <text x="52" y="345" class="ui" font-size="12" font-weight="700" fill="#FCE3B4">三种跨屏进入动作（右键「偏好设置」可自由切换）</text>
  <rect x="52" y="357" width="140" height="46" rx="8" fill="#E8B05C" fill-opacity="0.16" stroke="#E8B05C" stroke-opacity="0.5"/>
  <text x="122" y="376" text-anchor="middle" class="ui" font-size="11.5" font-weight="700" fill="#FCE3B4">🎲 组合随机（默认）</text>
  <text x="122" y="394" text-anchor="middle" class="ui" font-size="10" fill="#D0D7E6">轻跃与小跑自然交替</text>

  <rect x="205" y="357" width="140" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="275" y="376" text-anchor="middle" class="ui" font-size="11.5" font-weight="600" fill="#E5E9F0">🦘 仅灵动跳入</text>
  <text x="275" y="394" text-anchor="middle" class="ui" font-size="10" fill="#9BA4B5">抛物线弧线 + 落地缓冲</text>

  <rect x="358" y="357" width="140" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="428" y="376" text-anchor="middle" class="ui" font-size="11.5" font-weight="600" fill="#E5E9F0">🐾 仅平滑步行</text>
  <text x="428" y="394" text-anchor="middle" class="ui" font-size="10" fill="#9BA4B5">安静克制地走入边缘</text>

  <!-- ========================================================= -->
  <!-- RIGHT PANEL: Second Floating Layer Z-Order Architecture   -->
  <!-- ========================================================= -->
  <text x="572" y="38" class="ui" font-size="14.5" font-weight="700" fill="#F4F6FA">活跃窗口下第二浮现层：不挡打字视线，也不被旧窗口淹没</text>
  <text x="572" y="58" class="ui" font-size="11.5" fill="#9BA4B5">动态追踪系统焦点切换，始终驻留在「当前活跃窗口」与「后台旧窗口群」之间</text>

  <!-- Layered Stack Diagram -->
  <!-- Layer 3: Background Old Windows (Bottom of stack) -->
  <g filter="url(#boxShadow)">
    <rect x="618" y="82" width="408" height="92" rx="12" fill="#1A1F2D" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="634" y="96" width="84" height="22" rx="6" fill="#2E374D"/>
    <text x="676" y="111" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#A8B4CC">Layer 3+</text>
    <text x="730" y="112" class="ui" font-size="13" font-weight="700" fill="#CBD3E3">所有退居后台的旧窗口（浏览器 / 文档 / 音乐）</text>
    <text x="634" y="138" class="ui" font-size="11.5" fill="#8F9BB3">• 当窗口失去焦点退入后台时，自动排在 AuraPet 下方</text>
    <text x="634" y="158" class="ui" font-size="11.5" fill="#8F9BB3">• 彻底解决传统非置顶桌宠「开几个窗口就找不到」的痛点</text>
  </g>

  <!-- Up/Down Z-Order Connector -->
  <text x="822" y="191" text-anchor="middle" class="ui" font-size="11" font-weight="700" fill="#E8B05C">▲ 浮于所有后台旧窗口之上 ▲</text>

  <!-- Layer 2: AuraPet Companion Layer (Highlighted Middle Sweet-Spot) -->
  <g filter="url(#boxShadow)">
    <rect x="594" y="200" width="432" height="96" rx="12" fill="url(#layer2Glow)" stroke="#F0BA63" stroke-width="1.6"/>
    <rect x="610" y="214" width="92" height="24" rx="6" fill="#F0BA63"/>
    <text x="656" y="230" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#181B24">Layer 2 ★</text>
    <text x="714" y="231" class="ui" font-size="13.5" font-weight="700" fill="#FFF3D6">AuraPet 专属陪伴层（黄金第二浮现层）</text>
    <text x="610" y="257" class="ui" font-size="11.5" fill="#FCE8BE">• 桌宠本体、活力细条与对话云朵同层联动，在屏幕空隙自然陪伴</text>
    <text x="610" y="277" class="ui" font-size="11.5" fill="#FCE8BE">• 点击桌宠互动时临时升至前台，切回工作窗口后毫秒级归位第二层</text>
  </g>

  <!-- Up/Down Z-Order Connector -->
  <text x="822" y="313" text-anchor="middle" class="ui" font-size="11" font-weight="700" fill="#6EE7B7">▼ 让位于当前正在输入的焦点窗口 ▼</text>

  <!-- Layer 1: Active Focused Window (Top of stack) -->
  <g filter="url(#boxShadow)">
    <rect x="572" y="322" width="454" height="96" rx="12" fill="#21293B" stroke="#6EE7B7" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="588" y="336" width="84" height="22" rx="6" fill="#10B981" fill-opacity="0.22" stroke="#6EE7B7" stroke-opacity="0.6"/>
    <text x="630" y="351" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#A7F3D0">Layer 1</text>
    <text x="684" y="352" class="ui" font-size="13" font-weight="700" fill="#F4F6FA">当前活跃焦点窗口（正在编码的 IDE / 全屏会议）</text>
    <text x="588" y="378" class="ui" font-size="11.5" fill="#C4C0D8" fill-opacity="0.92">• 100% 保障你正在打字、阅读或演示的主窗口视野零遮挡、鼠标零误触</text>
    <text x="588" y="398" class="ui" font-size="11.5" fill="#9EE6C8">• 亦可随时在右键快捷磁贴一键切回「保持最前置顶」或开启「鼠标穿透」</text>
  </g>
</svg>
