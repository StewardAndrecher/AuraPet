<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="AuraPet 右键快捷仪表盘与四档智能陪伴节奏">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151822"/>
      <stop offset="100%" stop-color="#1E2230"/>
    </linearGradient>
    <linearGradient id="actGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A33E"/>
      <stop offset="100%" stop-color="#F9D87E"/>
    </linearGradient>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="126%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#05070C" flood-opacity="0.45"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      @keyframes pulseRing {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.95; }
      }
      @keyframes flowDot {
        to { stroke-dashoffset: -24; }
      }
      .active-ring { animation: pulseRing 2.2s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 6 6; animation: flowDot 1.2s linear infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="470" rx="18" fill="url(#panelBg)"/>
  <rect x="0.75" y="0.75" width="1078.5" height="468.5" rx="17.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="1.5"/>

  <!-- LEFT: Authentic Replica of AuraPet v1.0.34 Right-Click Context Dashboard -->
  <text x="42" y="38" class="ui" font-size="14" font-weight="700" fill="#F2F4F8">右键一体式角色仪表盘（单宠独立配置）</text>

  <g filter="url(#cardShadow)">
    <rect x="42" y="52" width="322" height="394" rx="12" fill="#22242A" stroke="#FFFFFF" stroke-opacity="0.12"/>

    <!-- 1. PetStatusBanner -->
    <rect x="52" y="62" width="302" height="58" rx="10" fill="#2C2E35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <circle cx="79" cy="87" r="17" fill="#384152"/>
    <text x="79" y="92" text-anchor="middle" class="ui" font-size="14" fill="#FCE3B4">🐾</text>
    <!-- Gold Activity Track -->
    <rect x="62" y="109" width="34" height="3.5" rx="1.75" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="62" y="109" width="29" height="3.5" rx="1.75" fill="url(#actGold)"/>

    <text x="106" y="84" class="ui" font-size="13" font-weight="700" fill="#F2F4F8">凯尔希 (1/2)</text>
    <text x="106" y="104" class="ui" font-size="11" fill="#9BA1AE">活力 86% · 缩放 100%</text>

    <rect x="278" y="70" width="66" height="24" rx="7" fill="#E8B05C" fill-opacity="0.18" stroke="#E8B05C" stroke-opacity="0.55"/>
    <text x="311" y="86" text-anchor="middle" class="ui" font-size="11" font-weight="700" fill="#FCE3B4">角色库 ›</text>

    <!-- 2. TreatCard: 4-Mode Selector + Quick Interactions -->
    <rect x="52" y="128" width="302" height="88" rx="10" fill="#2C2E35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="64" y="146" class="ui" font-size="10.5" fill="#9BA1AE">陪伴模式 · 当前感知：静伴</text>

    <!-- Segmented 4 Modes -->
    <rect x="62" y="153" width="282" height="26" rx="7" fill="#1E2026"/>
    <rect class="active-ring" x="64" y="155" width="68" height="22" rx="5.5" fill="#E8B05C" fill-opacity="0.24" stroke="#F0BA63"/>
    <text x="98" y="170" text-anchor="middle" class="ui" font-size="11" font-weight="700" fill="#FCE3B4">自动</text>
    <text x="168" y="170" text-anchor="middle" class="ui" font-size="11" fill="#C8CDD6">游玩</text>
    <text x="238" y="170" text-anchor="middle" class="ui" font-size="11" fill="#C8CDD6">日常</text>
    <text x="308" y="170" text-anchor="middle" class="ui" font-size="11" fill="#C8CDD6">静伴</text>

    <!-- Quick Interaction Buttons: 逗一逗 / 充个电 -->
    <rect x="62" y="185" width="136" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="130" y="201" text-anchor="middle" class="ui" font-size="11" font-weight="600" fill="#E5E9F0">🧶 逗一逗（互动）</text>

    <rect x="208" y="185" width="136" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="276" y="201" text-anchor="middle" class="ui" font-size="11" font-weight="600" fill="#A7F3D0">🌿 充个电（+活力）</text>

    <!-- 3. PetQuickControls 4 Tiles -->
    <g class="ui" font-size="10.5">
      <rect x="52" y="224" width="71" height="44" rx="8" fill="#E8B05C" fill-opacity="0.16" stroke="#E8B05C" stroke-opacity="0.6"/>
      <circle cx="115" cy="231" r="2.5" fill="#F0BA63"/>
      <text x="87.5" y="243" text-anchor="middle" fill="#FCE3B4" font-weight="700">漫步</text>
      <text x="87.5" y="260" text-anchor="middle" fill="#FCE3B4" font-weight="700">随机移动</text>

      <rect x="129" y="224" width="71" height="44" rx="8" fill="#E8B05C" fill-opacity="0.16" stroke="#E8B05C" stroke-opacity="0.6"/>
      <circle cx="192" cy="231" r="2.5" fill="#F0BA63"/>
      <text x="164.5" y="243" text-anchor="middle" fill="#FCE3B4" font-weight="700">跨屏</text>
      <text x="164.5" y="260" text-anchor="middle" fill="#FCE3B4" font-weight="700">跟随桌面</text>

      <rect x="206" y="224" width="71" height="44" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="241.5" y="243" text-anchor="middle" fill="#9BA1AE">第二层</text>
      <text x="241.5" y="260" text-anchor="middle" fill="#C8CDD6">保持置顶</text>

      <rect x="283" y="224" width="71" height="44" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="318.5" y="243" text-anchor="middle" fill="#9BA1AE">可点击</text>
      <text x="318.5" y="260" text-anchor="middle" fill="#C8CDD6">鼠标穿透</text>
    </g>

    <line x1="56" y1="278" x2="350" y2="278" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- 4. Categorized Submenus -->
    <g class="ui" font-size="12" fill="#ECEEF2">
      <text x="66" y="300">💬  对话与语音（角色卡 / 记忆 / 千问）</text>
      <text x="338" y="300" fill="#8B919E">›</text>

      <text x="66" y="325">✨  动作与姿态（开心 / 困倦 / 模板）</text>
      <text x="338" y="325" fill="#8B919E">›</text>

      <text x="66" y="350">⏱  桌面陪伴（番茄钟 / 休息 / 免打扰）</text>
      <text x="338" y="350" fill="#8B919E">›</text>

      <text x="66" y="375">🖥  外观与屏幕（缩放 / 第二浮现层）</text>
      <text x="338" y="375" fill="#8B919E">›</text>

      <line x1="56" y1="389" x2="350" y2="389" stroke="#FFFFFF" stroke-opacity="0.08"/>

      <text x="66" y="411">📦  导入与备份（智能抠图 / 角色包）</text>
      <text x="338" y="411" fill="#8B919E">›</text>

      <text x="66" y="435">⚙️  偏好设置（跨屏方式 / 专注表现）</text>
      <text x="338" y="435" fill="#8B919E">›</text>
    </g>
  </g>

  <!-- RIGHT: Smart Companion Auto-Sensing Engine & Focus Workflow -->
  <text x="406" y="38" class="ui" font-size="14" font-weight="700" fill="#F2F4F8">「自动」陪伴模式：实时感知前台工作状态，懂分寸不打扰</text>

  <!-- Central Sensing Hub -->
  <rect x="406" y="54" width="632" height="72" rx="12" fill="#232838" stroke="#6384FF" stroke-opacity="0.35"/>
  <text x="428" y="80" class="ui" font-size="12.5" font-weight="700" fill="#93C5FD">实时桌面上下文感知器（零隐私采集，仅检测窗口焦点与全屏状态）</text>
  <text x="428" y="104" class="ui" font-size="11.5" fill="#C4CBD8">自动监测：当前前台活跃进程  ·  外部全屏应用 / 游戏视频  ·  番茄钟倒计时状态  ·  角色当前活力值</text>

  <!-- Connecting Flow Lines -->
  <line class="flow-line" x1="505" y1="126" x2="505" y2="160" stroke="#F5C26B" stroke-width="2"/>
  <line class="flow-line" x1="722" y1="126" x2="722" y2="160" stroke="#60A5FA" stroke-width="2"/>
  <line class="flow-line" x1="938" y1="126" x2="938" y2="160" stroke="#34D399" stroke-width="2"/>

  <!-- Mode Card 1: Play -->
  <rect x="406" y="162" width="198" height="148" rx="12" fill="#292422" stroke="#F59E0B" stroke-opacity="0.45"/>
  <rect x="422" y="178" width="76" height="22" rx="11" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="460" y="193" text-anchor="middle" class="ui" font-size="11" font-weight="700" fill="#FCD34D">游玩节奏</text>
  <text x="422" y="220" class="ui" font-size="11.5" font-weight="600" fill="#F3F4F6">触发：正在与桌宠交互闲聊</text>
  <text x="422" y="244" class="ui" font-size="11" fill="#D1D5DB">• 积极探索桌面、沿边嬉戏</text>
  <text x="422" y="265" class="ui" font-size="11" fill="#D1D5DB">• 主动结合近期记忆搭话</text>
  <text x="422" y="286" class="ui" font-size="11" fill="#FCD34D">• 适合：工作间隙摸鱼解压</text>

  <!-- Mode Card 2: Daily -->
  <rect x="623" y="162" width="198" height="148" rx="12" fill="#202737" stroke="#60A5FA" stroke-opacity="0.45"/>
  <rect x="639" y="178" width="76" height="22" rx="11" fill="#3B82F6" fill-opacity="0.22"/>
  <text x="677" y="193" text-anchor="middle" class="ui" font-size="11" font-weight="700" fill="#93C5FD">日常节奏</text>
  <text x="639" y="220" class="ui" font-size="11.5" font-weight="600" fill="#F3F4F6">触发：常规网页浏览与轻办公</text>
  <text x="639" y="244" class="ui" font-size="11" fill="#D1D5DB">• 温和漫步与观察休息交替</text>
  <text x="639" y="265" class="ui" font-size="11" fill="#D1D5DB">• 低频轻柔问候，不喧宾夺主</text>
  <text x="639" y="286" class="ui" font-size="11" fill="#93C5FD">• 适合：全天候日常挂机陪伴</text>

  <!-- Mode Card 3: Quiet Focus -->
  <rect x="840" y="162" width="198" height="148" rx="12" fill="#1D2B2A" stroke="#34D399" stroke-opacity="0.5"/>
  <rect x="856" y="178" width="76" height="22" rx="11" fill="#10B981" fill-opacity="0.22"/>
  <text x="894" y="193" text-anchor="middle" class="ui" font-size="11" font-weight="700" fill="#6EE7B7">静伴节奏</text>
  <text x="856" y="220" class="ui" font-size="11.5" font-weight="600" fill="#F3F4F6">触发：开启专注 / 外部全屏</text>
  <text x="856" y="244" class="ui" font-size="11" fill="#D1D5DB">• 自动收敛主动发言与大幅跑动</text>
  <text x="856" y="265" class="ui" font-size="11" fill="#D1D5DB">• 可选「静伴微动」或「完全静止」</text>
  <text x="856" y="286" class="ui" font-size="11" fill="#6EE7B7">• 适合：沉浸码字、会议、观影</text>

  <!-- Focus Pomodoro Companion Strip -->
  <rect x="406" y="328" width="632" height="118" rx="12" fill="#232530" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="428" y="355" class="ui" font-size="13" font-weight="700" fill="#FCE3B4">⏱ 内置专注番茄钟与桌面健康统计（⌃⌥F 一键开启）</text>
  <text x="428" y="381" class="ui" font-size="11.5" fill="#D8DEE9">• 预设 15 / 25 / 50 分钟及自定义倒计时，支持暂停续计、短休（5m）与长休（15m）智能推荐</text>
  <text x="428" y="404" class="ui" font-size="11.5" fill="#D8DEE9">• 专注完成时，桌宠自动弹出暖心横幅并播放专属「开心/伸懒腰」动作与语音提醒休息</text>
  <text x="428" y="427" class="ui" font-size="11.5" fill="#9BA1AE">• 自动记录「今日专注轮次 · 累计时长 · 互动次数」，让桌面宠物真正成为你的效率搭子</text>
</svg>
